<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0a0f0d"/>
  
  <!-- Outer triangular frame, fractured -->
  <polygon points="128,18 238,214 18,214" fill="none" stroke="#c8d6c0" stroke-width="1.5" opacity="0.25"/>
  
  <!-- Fractured triangular radar shape - left shard -->
  <path d="M 128 32 L 60 196 L 128 168 Z" fill="#0a0f0d" stroke="#39ff88" stroke-width="2"/>
  
  <!-- Fractured triangular radar shape - right shard, offset -->
  <path d="M 128 32 L 196 196 L 128 168 Z" fill="#0a0f0d" stroke="#39ff88" stroke-width="2"/>
  
  <!-- Fracture line down center -->
  <line x1="128" y1="32" x2="128" y2="168" stroke="#39ff88" stroke-width="2"/>
  
  <!-- Radar sweep arcs -->
  <path d="M 92 140 Q 128 100 164 140" fill="none" stroke="#39ff88" stroke-width="1" opacity="0.6"/>
  <path d="M 78 168 Q 128 116 178 168" fill="none" stroke="#39ff88" stroke-width="0.8" opacity="0.4"/>
  <path d="M 64 196 Q 128 132 192 196" fill="none" stroke="#39ff88" stroke-width="0.6" opacity="0.25"/>
  
  <!-- Sweep line -->
  <line x1="128" y1="168" x2="200" y2="120" stroke="#39ff88" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Radar blip dots -->
  <circle cx="168" cy="128" r="2.5" fill="#39ff88"/>
  <circle cx="100" cy="152" r="1.8" fill="#39ff88" opacity="0.7"/>
  <circle cx="150" cy="180" r="1.5" fill="#39ff88" opacity="0.5"/>
  
  <!-- Piercing eye at center - outer ring -->
  <circle cx="128" cy="168" r="14" fill="#0a0f0d" stroke="#c8d6c0" stroke-width="1.5"/>
  
  <!-- Eye iris -->
  <circle cx="128" cy="168" r="9" fill="#0a0f0d" stroke="#ff3b3b" stroke-width="1.5"/>
  
  <!-- Eye pupil - vertical slit for predatory look -->
  <ellipse cx="128" cy="168" rx="2.5" ry="6" fill="#ff3b3b"/>
  
  <!-- Eye highlight -->
  <circle cx="125" cy="165" r="1.2" fill="#c8d6c0" opacity="0.8"/>
  
  <!-- Crosshair ticks around eye -->
  <line x1="128" y1="150" x2="128" y2="156" stroke="#ff3b3b" stroke-width="1.5"/>
  <line x1="128" y1="180" x2="128" y2="186" stroke="#ff3b3b" stroke-width="1.5"/>
  <line x1="110" y1="168" x2="116" y2="168" stroke="#ff3b3b" stroke-width="1.5"/>
  <line x1="140" y1="168" x2="146" y2="168" stroke="#ff3b3b" stroke-width="1.5"/>
  
  <!-- Corner HUD brackets -->
  <polyline points="28,28 56,28 56,36" fill="none" stroke="#c8d6c0" stroke-width="1.5" opacity="0.6"/>
  <polyline points="228,28 200,28 200,36" fill="none" stroke="#c8d6c0" stroke-width="1.5" opacity="0.6"/>
  <polyline points="28,228 56,228 56,220" fill="none" stroke="#c8d6c0" stroke-width="1.5" opacity="0.6"/>
  <polyline points="228,228 200,228 200,220" fill="none" stroke="#c8d6c0" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Tactical data ticks along top -->
  <line x1="72" y1="22" x2="72" y2="28" stroke="#c8d6c0" stroke-width="1" opacity="0.5"/>
  <line x1="96" y1="22" x2="96" y2="26" stroke="#c8d6c0" stroke-width="1" opacity="0.4"/>
  <line x1="160" y1="22" x2="160" y2="26" stroke="#c8d6c0" stroke-width="1" opacity="0.4"/>
  <line x1="184" y1="22" x2="184" y2="28" stroke="#c8d6c0" stroke-width="1" opacity="0.5"/>
  
  <!-- Small wordmark -->
  <text x="128" y="244" text-anchor="middle" font-family="monospace" font-size="9" fill="#39ff88" letter-spacing="3" opacity="0.7">AION2-ESP</text>
</svg>
